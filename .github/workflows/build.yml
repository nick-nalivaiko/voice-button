name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files and Git history for secrets
        shell: pwsh
        run: ./scripts/check-secrets.ps1 -History

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore VoiceButton.sln

      - name: Build
        run: dotnet build VoiceButton.sln -c Release --no-restore
